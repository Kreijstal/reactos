[FREELOADER]
DefaultOS=KmTest
TimeOut=0

[Display]
TitleText=ReactOS Kernel Test Runner
MinimalUI=Yes

[Operating Systems]
KmTest="ReactOS Kernel Test Mode"

[KmTest]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\reactos
Options=/FASTDETECT /MININT /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /KDSERIAL /SOS /NOGUIBOOT
