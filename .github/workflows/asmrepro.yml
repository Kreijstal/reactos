name: asmrepro

on:
  workflow_dispatch:

jobs:
  clangcl-confirm-fix:
    runs-on: windows-latest
    steps:
    - name: Checkout (this branch carries the fix)
      uses: actions/checkout@v6

    - name: Install LLVM 13.0.1 (the CI clang-cl version)
      shell: cmd
      run: choco install -y --allow-downgrade llvm --version 13.0.1

    - name: clang-cl version
      shell: cmd
      run: '"C:\Program Files\LLVM\bin\clang-cl.exe" --version'

    - name: Preprocess fixed amd64.S and i386.S on the ml path (clang-cl + _USE_ML)
      shell: cmd
      run: |
        "C:\Program Files\LLVM\bin\clang-cl.exe" /nologo -nostdinc /I sdk\include\asm /I boot\freeldr\freeldr /I boot\freeldr\freeldr\arch\i386 /I boot\freeldr\freeldr\arch\realmode /D__ASM__ /D_USE_ML /D_M_AMD64 /D__REACTOS__ /EP /c boot\freeldr\freeldr\arch\realmode\amd64.S > amd64.asm 2>nul
        "C:\Program Files\LLVM\bin\clang-cl.exe" /nologo -nostdinc /I sdk\include\asm /I boot\freeldr\freeldr /I boot\freeldr\freeldr\arch\i386 /I boot\freeldr\freeldr\arch\realmode /D__ASM__ /D_USE_ML /D_M_IX86 /D__REACTOS__ /EP /c boot\freeldr\freeldr\arch\realmode\i386.S > i386.asm 2>nul

    - name: Verdict
      shell: pwsh
      run: |
        function CM($f){ (Select-String -Path $f -Pattern '(^\s*\.macro\b)|(\.endm\b)' -AllMatches|Measure-Object).Count }
        function CU($f){ (Select-String -Path $f -Pattern '^\s*(call_far32|call_near16_indirect_bx)\b' -AllMatches|Measure-Object).Count }
        $am=CM 'amd64.asm'; $im=CM 'i386.asm'
        Write-Host "================= RESULT ================="
        Write-Host ("amd64.S : GAS .macro/.endm = {0} ; undefined custom-macro uses = {1}" -f $am, (CU 'amd64.asm'))
        Write-Host ("i386.S  : GAS .macro/.endm = {0} ; undefined custom-macro uses = {1}" -f $im, (CU 'i386.asm'))
        if ($am -eq 0 -and $im -eq 0) { Write-Host 'PASS: no GAS leakage on the clang-cl ml path - fix holds.' }
        else { Write-Host 'FAIL: GAS still leaking.'; exit 1 }
